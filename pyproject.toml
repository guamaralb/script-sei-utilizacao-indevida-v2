[project]
name = "script-sei-utilizacao-indevida-v2"
version = "0.1.0"
description = ""
authors = [
    {name = "Gustavo Amaral Bernardino",email = "gu.amaralb@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
webdriver-manager = "^4.0.2"
selenium = "^4.39.0"
python-dotenv = "^1.2.1"
reportlab = "^4.4.10"
# PATH do sei-automacao: Alterar para seu PC
sei-automacao = { path = "../../../sei-automacao", develop = true }
# sei-automacao = { path = "../sei-automacao", develop = true }

[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
ruff = "^0.14.13"
pytest = "^9.1.1"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
lint = {cmd = 'poetry run ruff check'}
pre_format = {cmd = 'poetry run ruff check --fix'}
format = {cmd = 'poetry run ruff format'}
pre_run = {cmd = "poetry run task format"}
pre_run_extra = {cmd = "poetry run task format"}
run = 'python script_sei_utilizacao_indevida_v2/main.py'
run_extra = 'python script_sei_utilizacao_indevida_v2/main_add_memo_nao_usou_rede_propria.py'
test = 'pytest'

[tool.pytest.ini_options]
testpaths = ['tests']
# Os módulos do script se importam pelo nome (ex.: from tags import ...)
pythonpath = ['script_sei_utilizacao_indevida_v2']

[tool.ruff]
line-length = 200
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
ignore = ['PLR0917', 'PLR0913']
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.lint.per-file-ignores]
"script_sei_utilizacao_indevida_v2/memorandos/*" = ["E501"]
# Nos testes, comparar com números literais é o esperado
"tests/*" = ["PLR2004"]

[tool.ruff.format]
preview = true
quote-style = 'single'
