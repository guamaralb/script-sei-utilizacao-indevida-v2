[project]
name = "script-sei-utilizacao-indevida-v2"
version = "0.1.0"
description = ""
authors = [
    {name = "Gustavo Amaral Bernardino",email = "gu.amaralb@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
webdriver-manager = "^4.0.2"
selenium = "^4.39.0"
python-dotenv = "^1.2.1"
reportlab = "^4.4.10"
sei-automacao = { path = "../sei-automacao", develop = true }


[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
ruff = "^0.14.13"
pytest = "^9.1.1"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
lint = {cmd = 'poetry run ruff check'}
pre_format = {cmd = 'poetry run ruff check --fix'}
format = {cmd = 'poetry run ruff format'}

# FLUXO INICIAL (NORMAL): DO MEMO DA APIS AOS MEMOS À APIS, À DISA OU À DEPROC
run_geacs_inicial = 'python script_sei_utilizacao_indevida_v2/main_geacs_inicial.py'
pre_run_geacs_inicial = {cmd = "poetry run task format"}

# RESPOSTAS (TODO: FLUXOS AINDA NÃO MONTADOS): CONFEREM O MARCADOR "AGUARDA"
# E TERMINAM COM ERRO, SEM AÇÃO NO SEI
run_geacs_resp_apis = 'python script_sei_utilizacao_indevida_v2/main_geacs_resp_apis.py'
pre_run_geacs_resp_apis = {cmd = "poetry run task format"}
run_geacs_resp_disa = 'python script_sei_utilizacao_indevida_v2/main_geacs_resp_disa.py'
pre_run_geacs_resp_disa = {cmd = "poetry run task format"}
run_geacs_resp_deproc = 'python script_sei_utilizacao_indevida_v2/main_geacs_resp_deproc.py'
pre_run_geacs_resp_deproc = {cmd = "poetry run task format"}

# ADICIONA PDF DA PLANILHA ANTIGA - AUTOMÁTICO: BAIXA A PLANILHA DO SEI E ADD
# PDF NO PROCESSO
run_geacs_adc_pdf_ant_aut = 'python script_sei_utilizacao_indevida_v2/main_geacs_adc_pdf_ant_aut.py'
pre_run_geacs_adc_pdf_ant_aut = {cmd = "poetry run task format"}

# ADICIONA PDF DA PLANILHA ANTIGA - MANUAL: PEGA PLANILHAS BAIXADAS
# MANUALMENTE E ADD PDF NO PROCESSO
# - Planilhas devem seguir o padrão
run_geacs_adc_pdf_ant_man = 'python script_sei_utilizacao_indevida_v2/main_geacs_adc_pdf_ant_man.py'
pre_run_geacs_adc_pdf_ant_man = {cmd = "poetry run task format"}

# VERIFICAR MARCADORES: LÊ OS MARCADORES E ATUALIZA AS COLUNAS TAG_* (UMA POR
# MARCADOR VÁLIDO) E DEMAIS_MARCADORES DA PLANILHA DE CONTROLE, SEM ALTERAR A
# PROX_ACAO E SEM AÇÃO NO SEI
run_geacs_verificar_marcadores = 'python script_sei_utilizacao_indevida_v2/main_geacs_verificar_marcadores.py'
pre_run_geacs_verificar_marcadores = {cmd = "poetry run task format"}

# CANCELAR MEMORANDO DEPROC ANTIGO: CANCELA O MEMO DEPROC ANTIGO DA GEACS
# (SUBSTITUÍDO POR UMA NOVA VERSÃO), SEM ALTERAR A PROX_ACAO
run_geacs_canc_memo_deproc_ant = 'python script_sei_utilizacao_indevida_v2/main_geacs_canc_memo_deproc_ant.py'
pre_run_geacs_canc_memo_deproc_ant = {cmd = "poetry run task format"}

# NA UNIDADE DA DEPROC: CONFERE O MEMO DEPROC ASSINADO, APURA A COPARTICIPAÇÃO
# NA BASE DO MANTIS, ANEXA O RELATÓRIO EM PDF E CRIA O MEMO DE RESULTADO
run_deproc_calcula_copa = 'python script_sei_utilizacao_indevida_v2/main_deproc_calcula_copa.py'
pre_run_deproc_calcula_copa = {cmd = "poetry run task format"}

# NA UNIDADE DA DEPROC: EXCLUI TODOS OS DOCUMENTOS DA DEPROC DO PROCESSO, SEM
# ALTERAR A PROX_ACAO (COLUNA PRÓPRIA DEPROC_EXCLUIR_DOCS)
run_deproc_excluir_docs = 'python script_sei_utilizacao_indevida_v2/main_deproc_excluir_docs.py'
pre_run_deproc_excluir_docs = {cmd = "poetry run task format"}
test = 'pytest'

[tool.pytest.ini_options]
testpaths = ['tests']
# Os módulos do script se importam pelo nome (ex.: from tags import ...)
pythonpath = ['script_sei_utilizacao_indevida_v2']

[tool.ruff]
line-length = 200
extend-exclude = ['migrations', 'docs']

[tool.ruff.lint]
preview = true
ignore = ['PLR0917', 'PLR0913']
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.lint.per-file-ignores]
"script_sei_utilizacao_indevida_v2/memorandos/*" = ["E501"]
# Nos testes, comparar com números literais é o esperado
"tests/*" = ["PLR2004"]

[tool.ruff.format]
preview = true
quote-style = 'single'
